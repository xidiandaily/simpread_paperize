[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperize"
version = "0.1.0"
description = "将简悦等离线 HTML 转为 A4 打印友好 PDF 的本地 CLI 工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "playwright>=1.40.0",
    "pytest>=7.0.0",
]

[project.scripts]
paperize = "paperize.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paperize = ["assets/styles/*.css", "runtime_patch.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
